name: Smoke Tests — Headless Chrome

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-headless-chrome:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Create config env file
        env:
          QAENV_URL:      ${{ secrets.QAENV_URL }}
          ADMIN_EMAIL:    ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          mkdir -p config
          python3 -c "
          import os, pathlib
          pathlib.Path('config/.env').write_text(
              'QAENV=' + os.environ['QAENV_URL'] + '\n' +
              'ADMIN_EMAIL=' + os.environ['ADMIN_EMAIL'] + '\n' +
              'ADMIN_PASSWORD=' + os.environ['ADMIN_PASSWORD'] + '\n'
          )
          "

      - name: Debug env value lengths (no values printed)
        run: |
          python3 -c "
          import pathlib
          for line in pathlib.Path('config/.env').read_text().strip().split('\n'):
              key, _, val = line.partition('=')
              print(f'{key} => length: {len(val)}')
          "

      - name: Run smoke tests
        run: npm run smoke:chrome

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7