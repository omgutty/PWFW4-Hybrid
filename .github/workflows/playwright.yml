name: Smoke Tests — Headless Chrome

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-headless-chrome:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      # Writing .env using Python so NO shell special character
      # interpretation happens at all.
      # Bash interprets ! and # even inside double quotes.
      # Python writes the value exactly as-is — byte for byte.
      - name: Create config env file
        env:
          QAENV_URL:      ${{ secrets.QAENV_URL }}
          ADMIN_EMAIL:    ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import os, pathlib
          pathlib.Path('config').mkdir(exist_ok=True)
          lines = [
            f"QAENV={os.environ['QAENV_URL']}",
            f"ADMIN_EMAIL={os.environ['ADMIN_EMAIL']}",
            f"ADMIN_PASSWORD={os.environ['ADMIN_PASSWORD']}",
          ]
          pathlib.Path('config/.env').write_text('\n'.join(lines) + '\n')
          PYEOF

      - name: Verify env file keys only (values never printed)
        run: cut -d'=' -f1 config/.env

      - name: Run smoke tests
        run: npm run smoke:chrome

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
